name: build-minisyf

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: "versionName（写入 APK，如 1.15-yf1）"
        required: false
        default: "1.15-yf1"
      create_release:
        description: "构建成功后创建 GitHub Release"
        type: boolean
        required: false
        default: true
  push:
    tags:
      - "v*"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apk:
    name: build apk (arm64-v8a)
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout (with native submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Android SDK packages
        id: sdk
        run: |
          export ANDROID_HOME="${ANDROID_SDK_ROOT}"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;29.0.14206865" \
            "cmake;3.22.1"
          NDK_DIR="$ANDROID_HOME/ndk/29.0.14206865"
          test -d "$NDK_DIR" || { echo "NDK missing at $NDK_DIR"; exit 1; }
          echo "ANDROID_NDK_HOME=$NDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_NDK=$NDK_DIR" >> "$GITHUB_ENV"
          echo "ndk=$NDK_DIR" >> "$GITHUB_OUTPUT"

      - name: Go 1.25
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: false

      - name: Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('src/android/**/*.gradle.kts', 'src/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Build native deps (proot + alpine rootfs + rclone)
        run: |
          set -euo pipefail
          # proot 的 loader-info.awk 用了 strtonum（gawk 扩展），Ubuntu 默认
          # mawk 会报 "function strtonum never defined" 直接中断
          sudo apt-get update -qq && sudo apt-get install -y -qq gawk
          sudo update-alternatives --set awk /usr/bin/gawk || sudo ln -sf /usr/bin/gawk /usr/bin/awk
          export PATH="$(go env GOPATH)/bin:$PATH"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          # provider customization template (empty values are fine)
          cp -n src/android/app/provider-customization.properties.example \
                src/android/app/provider-customization.properties
          bash deps/build_proot.sh
          bash scripts/prepare_android_sandbox.sh
          go install golang.org/x/mobile/cmd/gomobile@latest
          gomobile init
          bash deps/build_rclone_android.sh
          mkdir -p src/android/app/libs
          cp deps/build/rclone/rclone.aar src/android/app/libs/
          ls -la src/android/app/src/main/assets/ src/android/app/src/main/jniLibs/arm64-v8a/ src/android/app/libs/

      - name: Decode signing keystore
        env:
          MINISYF_KEYSTORE_B64: ${{ secrets.MINISYF_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          if [ -z "${MINISYF_KEYSTORE_B64:-}" ]; then
            echo "::error::secret MINISYF_KEYSTORE_B64 未配置，无法签名"
            exit 1
          fi
          echo "$MINISYF_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/minisyf.jks"
          test -s "$RUNNER_TEMP/minisyf.jks"

      - name: Assemble release
        env:
          MINISYF_KEYSTORE_PATH: ${{ runner.temp }}/minisyf.jks
          MINISYF_KEYSTORE_PASSWORD: ${{ secrets.MINISYF_STORE_PASSWORD }}
          MINISYF_KEY_PASSWORD: ${{ secrets.MINISYF_KEY_PASSWORD }}
          MINISYF_KEY_ALIAS: minisyf
          VERSION_NAME: ${{ inputs.version_name || '1.15-yf1' }}
        run: |
          set -euo pipefail
          cd src/android
          ./gradlew :app:assembleGithubRelease \
            -PversionNameOverride="$VERSION_NAME" \
            --no-daemon --stacktrace

      - name: Collect artifacts
        id: collect
        run: |
          set -euo pipefail
          mkdir -p out
          APK=$(find src/android/app/build/outputs/apk -path "*github*release*" -name "*.apk" | head -1)
          test -n "$APK" || { echo "::error::no apk produced"; exit 1; }
          VN="${{ inputs.version_name || '1.15-yf1' }}"
          cp "$APK" "out/minisYf-${VN}.apk"
          SYM=$(find src/android/app/build/outputs -name "native-debug-symbols.zip" | head -1 || true)
          [ -n "$SYM" ] && cp "$SYM" "out/minisYf-${VN}-symbols.zip" || true
          sha256sum out/*.apk | tee out/SHA256SUMS.txt
          echo "apk=out/minisYf-${VN}.apk" >> "$GITHUB_OUTPUT"
          echo "vn=$VN" >> "$GITHUB_OUTPUT"
          ls -lh out/

      - name: Verify signing certificate
        run: |
          set -euo pipefail
          APK="${{ steps.collect.outputs.apk }}"
          BUILD_TOOLS="$ANDROID_HOME/build-tools/36.0.0"
          "$BUILD_TOOLS/apksigner" verify --print-certs "$APK" | grep -E "Signer #1 certificate (DN|SHA-256)" || true
          "$BUILD_TOOLS/aapt2" dump badging "$APK" 2>/dev/null | head -3 || true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: minisYf-${{ steps.collect.outputs.vn }}
          path: out/
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        if: ${{ (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || inputs.create_release }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'push' && github.ref_name || format('v{0}', steps.collect.outputs.vn) }}
          name: minisYf ${{ steps.collect.outputs.vn }}
          body: |
            minisYf ${{ steps.collect.outputs.vn }} — OpenMinis 1.15 改造版（御风人格 + 自签）

            - 应用名 `minisYf`，包名 `com.minisyf.app`（与原版 OpenMinis 可并存安装）
            - SOUL.md 预置御风人格；人格长度上限 1600字/1000词 → 30000字/20000词
            - 关闭 SOUL.md 的「提示词注入」行过滤（原逻辑会静默删掉合法人格里的句子）
            - 保留上游全部能力：Linux 沙箱（Alpine/PRoot）、浏览器、子 agent、技能、记忆
            - 签名：自签 RSA 4096，有效期至 2056

            SHA256 见 SHA256SUMS.txt
          files: |
            out/minisYf-*.apk
            out/SHA256SUMS.txt
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
